services:
  - type: web
    name: sketchbook-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      # DB는 Neon(무료, 만료 없음)의 PostgreSQL — 연결 주소(비밀번호 포함)는
      # 여기 커밋하지 않고 Render 대시보드 Environment 탭에서 직접 넣음.
      # (2026-09-27에 Render 무료 DB에서 옮김. 풀러 없는 직접 연결 주소 +
      # ?sslmode=require.)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://ddonni.github.io"
      # S3 credentials/bucket aren't tracked here — set these directly in
      # the Render dashboard (Environment tab) after creating the bucket.
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # 구글 계정으로 내 방 복구 기능용 OAuth client id — 비밀은 아니지만
      # 값을 여기 커밋해두지 않고, Google Cloud Console에서 발급받은 뒤
      # Render 대시보드 Environment 탭에서 채움 (js/shared/config.js의
      # 프론트 client_id와 반드시 같은 값이어야 함).
      - key: GOOGLE_CLIENT_ID
        sync: false

# 예전 Render 무료 DB — 이제 서버는 안 씀(위 DATABASE_URL 참고). 무료 기간이
# 끝나는 2026-10-15 무렵까지 되돌릴 수 있는 백업으로만 남겨둠. 그 뒤 이 블록을 지움.
databases:
  - name: sketchbook-db
    plan: free
    databaseName: sketchbook
    user: sketchbook
