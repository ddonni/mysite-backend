services:
  - type: web
    name: sketchbook-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sketchbook-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://ddonni.github.io"

databases:
  - name: sketchbook-db
    plan: free
    databaseName: sketchbook
    user: sketchbook
