services:
  - type: web
    name: sketchbook-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sketchbook-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://ddonni.github.io"
      # S3 credentials/bucket aren't tracked here — set these directly in
      # the Render dashboard (Environment tab) after creating the bucket.
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # 구글 계정으로 내 방 복구 기능용 OAuth client id — 비밀은 아니지만
      # 값을 여기 커밋해두지 않고, Google Cloud Console에서 발급받은 뒤
      # Render 대시보드 Environment 탭에서 채움 (js/shared/config.js의
      # 프론트 client_id와 반드시 같은 값이어야 함).
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: sketchbook-db
    plan: free
    databaseName: sketchbook
    user: sketchbook
