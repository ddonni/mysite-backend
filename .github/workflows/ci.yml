name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  # 테스트를 통과하고 main에 push됐을 때만 운영 서버(EC2)에 배포. PR은 테스트만.
  # GitHub Secrets: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, DISCORD_WEBHOOK_URL
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나씩. 연달아 push하면 늦게 시작한 배포가 먼저 것을 덮어쓰지 않게 차례대로.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # OIDC 증명서 발급 — AWS 키를 저장하지 않고 임시 권한을 빌림
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      HEALTH_URL: https://mysite-ddonni.duckdns.org/health/db
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 서버의 /usr/local/bin/mysite-deploy를 SSM으로 실행(서버에 SSH 없음).
      # 테스트를 통과한 바로 그 커밋(GITHUB_SHA)을 넘긴다 — 그사이 main이 바뀌어도 이것만 배포.
      - name: Deploy on the server (SSM)
        run: |
          params=$(jq -n --arg c "/usr/local/bin/mysite-deploy $GITHUB_SHA" '{commands: [$c]}')
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"
          # 명령이 실패해도 waiter가 바로 에러를 내므로, 일단 기다린 뒤 결과를 직접 확인
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [ "$status" = "Success" ]

      # 재시작 직후 몇 초는 Nginx가 502를 냄(mysite-infra 트러블슈팅 #14).
      # 바깥 감시(Lambda)와 같은 규칙: 20초 간격 3번 중 한 번이라도 200이면 성공.
      - name: Check /health/db
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$HEALTH_URL" || true)
            echo "try $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      # 배포 잡이 어디서든 실패하면 디스코드로. (테스트 실패는 운영 장애가 아니라 GitHub 기본 메일로 충분)
      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="[배포 실패] mysite-backend ${GITHUB_SHA::7} (어느 단계에서 실패했는지는 링크에서 확인) $RUN_URL"
          curl -sS --fail -m 30 -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$msg" '{content: $c}')" "$WEBHOOK"
